[package]
name = "band"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.9"

[dev-dependencies]
alloy-primitives = { version = "1.5.7", features = ["k256"] }
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = "1.0.151"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []
