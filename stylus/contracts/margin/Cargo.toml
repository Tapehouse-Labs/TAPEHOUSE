# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "margin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
ownable = { path = "../../crates/ownable" }
stylus-sdk = "0.10.9"

[dev-dependencies]
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = "1.0.151"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi", "ownable/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []
