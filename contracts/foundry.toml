[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
isolate = true
fs_permissions = [{ access = "read", path = "../deployments" }]

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood-testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
devnode = "http://127.0.0.1:8547"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
