[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../lib"]
remappings = [
    "@uniswap/v3-core/=../lib/v3-core/",
    "forge-std/=../lib/forge-std/src/",
]
auto_detect_solc = true
evm_version = "london"
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"
