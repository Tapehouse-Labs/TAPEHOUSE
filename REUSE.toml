SPDX-License-Identifier = "MIT OR Apache-2.0"
SPDX-FileComment = "Generated by make bindings from the Solidity build's ABIs; abigen writes the Go bindings."

[[annotations]]
path = [
    "apps/landing/public/art/i1-beam.jpg",
    "apps/landing/public/art/i2-socket.jpg",
    "apps/landing/public/art/i3-cards.jpg",
    "apps/landing/public/hero/floor-dawn.jpg",
    "apps/landing/public/hero/floor-day.jpg",
]
SPDX-FileCopyrightText = "Tapehouse contributors"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "Generated with OpenAI's gpt-image-1; each file embeds its prompt. Machine-generated images may carry no copyright; whatever rights Tapehouse contributors hold in them are waived under CC0."

[[annotations]]
path = [
    "apps/app/AGENTS.md",
    "apps/app/CLAUDE.md",
    "apps/app/README.md",
    "apps/app/eslint.config.mjs",
    "apps/app/next.config.ts",
    "apps/app/postcss.config.mjs",
    "apps/landing/AGENTS.md",
    "apps/landing/CLAUDE.md",
    "apps/landing/README.md",
    "apps/landing/eslint.config.mjs",
    "apps/landing/next.config.ts",
    "apps/landing/postcss.config.mjs",
    "apps/landing/tsconfig.json",
]
precedence = "override"
SPDX-FileCopyrightText = "Vercel, Inc."
SPDX-License-Identifier = "MIT"
SPDX-FileComment = "Written unchanged by create-next-app and next dev."

[[annotations]]
path = ["apps/app/.gitignore", "apps/landing/.gitignore"]
precedence = "override"
SPDX-FileCopyrightText = ["Vercel, Inc.", "Tapehouse contributors"]
SPDX-License-Identifier = "MIT"
SPDX-FileComment = "Written by create-next-app; the last lines are Tapehouse's."

[[annotations]]
path = "apps/app/tsconfig.json"
precedence = "override"
SPDX-FileCopyrightText = ["Vercel, Inc.", "Tapehouse contributors"]
SPDX-License-Identifier = "MIT"
SPDX-FileComment = "Written by create-next-app; Tapehouse raised its target to ES2020 for BigInt literals."

[[annotations]]
path = "stylus/scripts/stylus-deployer.hex"
precedence = "override"
SPDX-FileCopyrightText = "Offchain Labs, Inc."
SPDX-License-Identifier = "MIT"
SPDX-FileComment = "CREATE2 salt and initcode of StylusDeployer (nitro-contracts, src/stylus/StylusDeployer.sol, which declares MIT and compiles in only the ArbWasm precompile's interface), as nitro-devnode deploys it."

[[annotations]]
path = [
    "stylus/contracts/band/testdata/*.hex",
    "services/internal/redstone/testdata/*.hex",
    "services/internal/redstone/testdata/*.json",
]
precedence = "override"
SPDX-FileCopyrightText = "RedStone Oracles"
SPDX-License-Identifier = "LicenseRef-RedStone-Data"
SPDX-FileComment = "Signed data packages from RedStone's public gateway, unmodified. REUSE requires a holder; the source is named, and no copyright is asserted over the data."
